name: Build and deploy website

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build current CV and static site
        run: |
          python3 -m pip install --disable-pip-version-check reportlab
          python3 -m py_compile scripts/apply_cv_audit.py scripts/build_v4.py scripts/enrich_presentation_links.py scripts/enrich_work_details.py
          python3 scripts/apply_cv_audit.py
          python3 -m py_compile scripts/build_cv.py
          python3 scripts/build_cv.py
          python3 scripts/build_v4.py
          python3 scripts/enrich_presentation_links.py
          python3 scripts/enrich_work_details.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
